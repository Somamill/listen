name: iOS player preview
on:
  push:
    branches: [main, 'feature/ios-player']
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
permissions:
  contents: read
jobs:
  simulator-build:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build native iOS and iPadOS target
        run: xcodebuild -project ios/Listen.xcodeproj -scheme Listen -sdk iphonesimulator -configuration Debug -derivedDataPath build/ios CODE_SIGNING_ALLOWED=NO build
      - name: Verify packaged audio and extensions
        run: python3 ios/scripts/check_bundle.py build/ios/Build/Products/Debug-iphonesimulator/Listen.app
      - name: Test media, conversion, import and progress logic
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; import re; devices=json.load(sys.stdin)["devices"]; runtimes=sorted((k for k in devices if "SimRuntime.iOS-" in k),key=lambda k:tuple(map(int,re.findall(r"[0-9]+",k))),reverse=True); print(next(d["udid"] for r in runtimes for d in devices[r] if "iPhone" in d["name"]))')
          xcrun simctl boot "$DEVICE_ID" || true
          xcrun simctl bootstatus "$DEVICE_ID" -b
          xcodebuild -project ios/Listen.xcodeproj -scheme Listen -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath build/ios -only-testing:ListenTests -parallel-testing-enabled NO -test-timeouts-enabled YES -maximum-test-execution-time-allowance 90 CODE_SIGNING_ALLOWED=NO test
