name: Listen
options:
  bundleIdPrefix: io.github.somamill
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    TARGETED_DEVICE_FAMILY: '1,2'
    DEVELOPMENT_TEAM: ''
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  Listen:
    type: application
    platform: iOS
    sources: [Listen]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.somamill.listen.mobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Listen/Info.plist
        CODE_SIGN_ENTITLEMENTS: Listen/Listen.entitlements
    dependencies: []
  ListenTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ListenTests]
    dependencies:
      - target: Listen
  ListenUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ListenUITests]
    dependencies:
      - target: Listen
schemes:
  Listen:
    build:
      targets:
        Listen: all
    test:
      targets: [ListenTests, ListenUITests]
