name: Listen
options:
  bundleIdPrefix: io.github.somamill
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.9'
    TARGETED_DEVICE_FAMILY: '1,2'
    DEVELOPMENT_TEAM: ''
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '3'
    ENABLE_USER_SCRIPT_SANDBOXING: YES
packages:
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: 0.9.20
targets:
  Listen:
    type: application
    platform: iOS
    sources: [Listen, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.somamill.listen.mobile
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        MACOSX_DEPLOYMENT_TARGET: 14.0
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Listen/ListenMac.entitlements
        PRODUCT_NAME[sdk=macosx*]: listen Player
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Listen/Info.plist
        CODE_SIGN_ENTITLEMENTS: Listen/Listen.entitlements
        PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: $(LISTEN_IOS_PROFILE_APP)
        PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]: $(LISTEN_MAC_PROFILE_APP)
    dependencies:
      - package: ZIPFoundation
      - target: ListenWidgets
      - target: ListenShare
  ListenWidgets:
    type: app-extension
    platform: iOS
    sources: [ListenWidgets, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.somamill.listen.mobile.widgets
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        MACOSX_DEPLOYMENT_TARGET: 14.0
        INFOPLIST_FILE: ListenWidgets/Info.plist
        CODE_SIGN_ENTITLEMENTS: ListenWidgets/ListenWidgets.entitlements
        PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: $(LISTEN_IOS_PROFILE_WIDGET)
        PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]: $(LISTEN_MAC_PROFILE_WIDGET)
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: ListenWidgets/ListenWidgetsMac.entitlements
        SKIP_INSTALL: YES
  ListenShare:
    type: app-extension
    platform: iOS
    sources: [ListenShare, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.somamill.listen.mobile.share
        SUPPORTS_MACCATALYST: YES
        DERIVE_MACCATALYST_PRODUCT_BUNDLE_IDENTIFIER: NO
        MACOSX_DEPLOYMENT_TARGET: 14.0
        INFOPLIST_FILE: ListenShare/Info.plist
        CODE_SIGN_ENTITLEMENTS: ListenShare/ListenShare.entitlements
        PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]: $(LISTEN_IOS_PROFILE_SHARE)
        PROVISIONING_PROFILE_SPECIFIER[sdk=macosx*]: $(LISTEN_MAC_PROFILE_SHARE)
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: ListenShare/ListenShareMac.entitlements
        SKIP_INSTALL: YES
  ListenTests:
    type: bundle.unit-test
    platform: iOS
    sources: [ListenTests]
    dependencies:
      - target: Listen
      - package: ZIPFoundation
  ListenUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [ListenUITests]
    dependencies:
      - target: Listen
schemes:
  Listen:
    build:
      targets:
        Listen: all
    test:
      targets: [ListenTests, ListenUITests]
